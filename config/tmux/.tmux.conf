# Basic tmux configuration.

# Prefix: C-b → C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 1-based window/pane indexes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# General
# Set the default shell explicitly so PS1 and sourcing work correctly.
set -g default-shell ${SHELL}
set -g default-command ${SHELL}
set -g mouse on
set -g history-limit 10000
set -sg escape-time 0          " 10 → 0: better for vim/neovim
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   " true color support
setw -g mode-keys vi

# Pane splitting (keep the current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in the same directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy mode — pipe selection to macOS clipboard via pbcopy
# (Terminal.app doesn't support OSC 52 so set-clipboard external doesn't work)
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Status bar
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=green][#S] "
set -g status-right "#[fg=yellow]%Y-%m-%d %H:%M "
set -g status-left-length 30

# Plugins (disabled — requires TPM)
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'
# run '~/.tmux/plugins/tpm/tpm'   " must be last line when TPM is active