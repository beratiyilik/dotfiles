# =============================================================================
# defaults.conf — declarative macOS system preferences (committed base)
#
# This is the single source of truth applied by os/macos/defaults.sh.
# Each non-comment row is one `defaults write` operation:
#
#   group  domain  key  type  value
#
#   group   one of: dock | finder | keyboard | screenshots | global
#           (selected by `dotfiles defaults --<group>`; default: all)
#   domain  preference domain (e.g. com.apple.dock, NSGlobalDomain)
#   key     preference key
#   type    bool | int | float | string  (maps to defaults write -<type>)
#   value   the value; a leading ~ expands to $HOME
#
# Columns are whitespace-separated; `value` is the rest of the line, so it may
# contain spaces. Lines starting with # and blank lines are ignored.
#
# Machine-specific overrides go in defaults.local.conf (gitignored), which is
# applied AFTER this file so it wins on conflicts. Generate it with:
#   dotfiles defaults --sync
# =============================================================================

# group        domain                    key                                  type    value

# --- Dock --------------------------------------------------------------------
dock           com.apple.dock            autohide                             bool    true
dock           com.apple.dock            autohide-delay                       float   0
dock           com.apple.dock            autohide-time-modifier               float   0.4
dock           com.apple.dock            tilesize                             int     48
dock           com.apple.dock            minimize-to-application              bool    true
dock           com.apple.dock            show-recents                         bool    false
dock           com.apple.dock            mru-spaces                           bool    false
dock           com.apple.dock            mineffect                            string  scale

# --- Finder ------------------------------------------------------------------
finder         com.apple.finder          ShowStatusBar                        bool    true
finder         com.apple.finder          ShowPathbar                          bool    true
finder         NSGlobalDomain            AppleShowAllExtensions               bool    true
finder         com.apple.finder          AppleShowAllFiles                    bool    true
finder         com.apple.finder          FXPreferredViewStyle                 string  Nlsv
finder         com.apple.finder          _FXSortFoldersFirst                  bool    true
finder         com.apple.finder          FXDefaultSearchScope                 string  SCcf
finder         com.apple.finder          FXEnableExtensionChangeWarning       bool    false
finder         com.apple.finder          WarnOnEmptyTrash                     bool    false
finder         com.apple.desktopservices DSDontWriteNetworkStores             bool    true
finder         com.apple.desktopservices DSDontWriteUSBStores                 bool    true

# --- Keyboard ----------------------------------------------------------------
keyboard       NSGlobalDomain            InitialKeyRepeat                     int     15
keyboard       NSGlobalDomain            KeyRepeat                            int     2
keyboard       NSGlobalDomain            ApplePressAndHoldEnabled             bool    false
keyboard       NSGlobalDomain            NSAutomaticCapitalizationEnabled     bool    false
keyboard       NSGlobalDomain            NSAutomaticDashSubstitutionEnabled   bool    false
keyboard       NSGlobalDomain            NSAutomaticQuoteSubstitutionEnabled  bool    false
keyboard       NSGlobalDomain            NSAutomaticPeriodSubstitutionEnabled bool    false
keyboard       NSGlobalDomain            NSAutomaticSpellingCorrectionEnabled bool    false

# --- Screenshots -------------------------------------------------------------
screenshots    com.apple.screencapture   location                             string  ~/Desktop
screenshots    com.apple.screencapture   type                                 string  png
screenshots    com.apple.screencapture   disable-shadow                       bool    true
screenshots    com.apple.screencapture   show-thumbnail                       bool    false

# --- Global ------------------------------------------------------------------
global         NSGlobalDomain            NSDocumentSaveNewDocumentsToCloud    bool    false
global         NSGlobalDomain            NSNavPanelExpandedStateForSaveMode   bool    true
global         NSGlobalDomain            NSNavPanelExpandedStateForSaveMode2  bool    true
global         NSGlobalDomain            PMPrintingExpandedStateForPrint      bool    true
global         NSGlobalDomain            PMPrintingExpandedStateForPrint2     bool    true
global         com.apple.CrashReporter   DialogType                           string  none
global         com.apple.menuextra.battery ShowPercent                        bool    true
global         com.apple.finder          QuitMenuItem                         bool    true

## eof
