name: shellcheck

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          find . -type f \( -name '*.sh' -o -name '*.bash' \) \
            | grep -v '^\./\.git/' \
            | xargs shellcheck --severity=warning
