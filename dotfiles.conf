# dotfiles.conf — installer configuration
#
# Sourced by dotfiles CLI. Edit this file to manage symlinks, plugins, and
# directories without touching the CLI.

# ── required directories ──────────────────────────────────────────────────────
# Created before symlinking. Paths relative to $HOME.
# ~/.ssh is always created with 700 — list other dirs here.
DIRS=(
  ".config"
  ".config/1Password/ssh"
  ".aws"
)

# ── oh-my-zsh plugins & themes ────────────────────────────────────────────────
# Format: "label|repo_url|install_subpath"
#   label           — display name
#   repo_url        — git clone URL
#   install_subpath — path relative to $ZSH_CUSTOM (themes/... or plugins/...)
OMZ_PLUGINS=(
  "powerlevel10k|https://github.com/romkatv/powerlevel10k|themes/powerlevel10k"
  "zsh-autosuggestions|https://github.com/zsh-users/zsh-autosuggestions|plugins/zsh-autosuggestions"
  "zsh-syntax-highlighting|https://github.com/zsh-users/zsh-syntax-highlighting|plugins/zsh-syntax-highlighting"
  "zsh-history-substring-search|https://github.com/zsh-users/zsh-history-substring-search|plugins/zsh-history-substring-search"
)

# ── symlinks ──────────────────────────────────────────────────────────────────
# Format: "src:dst[:mode]"
#   src  — path relative to DOTFILES_DIR
#   dst  — path relative to $HOME
#   mode — optional chmod (e.g. 600 for SSH config)
SYMLINKS=(
  # ── zsh ──────────────────────────────────────────────────────────────────
  "shell/zsh/.zshenv:.zshenv"
  "shell/zsh/.zprofile:.zprofile"
  "shell/zsh/.zshrc:.zshrc"

  # ── bash ─────────────────────────────────────────────────────────────────
  "shell/bash/.bashrc:.bashrc"
  "shell/bash/.bash_profile:.bash_profile"

  # ── editors ──────────────────────────────────────────────────────────────
  "config/vim/.vimrc:.vimrc"
  "config/nano/.nanorc:.nanorc"
  "config/editorconfig/.editorconfig:.editorconfig"

  # ── git ──────────────────────────────────────────────────────────────────
  "config/git/.gitconfig:.gitconfig"
  "config/git/.gitignore_global:.gitignore_global"
  "config/git/.gitmessage:.gitmessage"

  # ── terminal tools ────────────────────────────────────────────────────────
  "config/tmux/.tmux.conf:.tmux.conf"
  "config/readline/.inputrc:.inputrc"
  "config/fzf/.fzf.sh:.fzf.sh"
  "config/p10k/.p10k.zsh:.p10k.zsh"
  "config/starship/starship.toml:.config/starship.toml"

  # ── services ──────────────────────────────────────────────────────────────
  "config/aws/config:.aws/config"
  "config/1Password/agent.toml:.config/1Password/ssh/agent.toml"

  # ── ssh (strict permissions) ──────────────────────────────────────────────
  "config/ssh/config:.ssh/config:600"
)
